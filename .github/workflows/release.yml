name: Publish GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match tag to package version
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm exec --yes --ignore-scripts --package=bb-app@0.46.1 -- bb plugin build .
      - run: npm run check:release
      - run: npm pack --ignore-scripts
      - name: Publish the validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --title "Diff Tree $GITHUB_REF_NAME" --notes-file release/github-notes.md
